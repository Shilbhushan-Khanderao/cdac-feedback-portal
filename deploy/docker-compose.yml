# Run from repo root:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
# Every secret is required (no defaults): compose refuses to start if one is missing.
name: cdac-feedback

x-logging: &logging
  # CMP-7: CERT-In expects ICT logs retained 180 days. Sizing math (campus feedback portal,
  # generous upper bound): ~1 req/sec sustained over 12 active h/day = ~43k req/day; nginx's
  # JSON access-log line (~250B) + the API's pino JSON line(s) per request (~350B) run to
  # roughly 25-30MB/day each for the two request-handling containers. 180 days * ~30MB/day
  # ~= 5.4GB, so 5GB/container (50m x 100) covers that with margin; db/migrate/backup log far
  # less and get the same generous cap for free (disk is cheap, one shared anchor is simpler
  # than per-service tuning). This is still local rotation, not durable retention -- see
  # DEPLOYMENT-CHECKLIST.md's logging note: it only lasts as long as this host's disk does,
  # and a host rebuild loses it. True 180-day durability needs shipping logs off this host.
  driver: json-file
  options: { max-size: "50m", max-file: "100" }

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in deploy/.env}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in deploy/.env}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in deploy/.env}
  APP_URL: ${APP_URL:?set APP_URL in deploy/.env}
  CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in deploy/.env}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}

services:
  db:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # No schema/seed mounts: the schema is applied by the `migrate` service.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    logging: *logging
    networks: [internal_net]

  # One-shot: applies migrations as the DB owner, then exits. api waits for it.
  migrate:
    build: { context: ../server, dockerfile: ../deploy/Dockerfile.server }
    image: cdac-feedback-api:local
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    environment:
      <<: *api-env
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: *logging
    networks: [internal_net]

  api:
    image: cdac-feedback-api:local
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: "3000"
      HOST: 0.0.0.0
      # Runtime connects as the non-superuser, non-owner role feedback_app (RLS enforced).
      DATABASE_URL: postgresql://feedback_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging: *logging
    networks: [internal_net]

  # nginx + built SPA (Dockerfile.web builds the frontend; no separate dist step).
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME (public hostname) in deploy/.env}
    image: cdac-feedback-web:local
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro   # fullchain.pem + privkey.pem
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: *logging
    networks: [internal_net]

  # Daily encrypted pg_dump at 02:00 + 180-day retention + optional offsite copy.
  backup:
    build: { context: ./backup }
    image: cdac-feedback-backup:local
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      # Optional least-privilege backup role (INF-3); backup.sh falls back to PGUSER/PGPASSWORD
      # above when unset, so this is safe to leave empty until a DBA grants the role.
      BACKUP_DB_ROLE: ${BACKUP_DB_ROLE:-}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY in deploy/.env}
      BACKUP_OFFSITE_TARGET: ${BACKUP_OFFSITE_TARGET:-}
      BACKUP_OFFSITE_SSH_KEY: ${BACKUP_OFFSITE_SSH_KEY:-/run/offsite_key}
    volumes:
      - backups_data:/backups
    depends_on:
      db: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: *logging
    networks: [internal_net]

volumes:
  pgdata:
  backups_data:

networks:
  internal_net:
    driver: bridge
