user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting zone (DoS & Brute-force Defense)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # S5: Redirect all HTTP to HTTPS (required for HSTS and Secure cookies).
        # C-DAC IT: set server_name to the actual hostname.
        return 301 https://$host$request_uri;

        # Root static frontend
        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------- Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

        # Static React SPA routing
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Auth Endpoints (Tight Rate Limit)
        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_backend/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Probe
        location /healthz {
            proxy_pass http://api_backend/healthz;
            access_log off;
        }
    }

    # ---------------------------------------------------------------- HTTPS (TLS) — Production Block
    # S5: Uncomment and configure after C-DAC IT issues the TLS certificate.
    # Replace cert paths with actual paths on the host volume.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name feedback.cdac.in;  # <-- set actual hostname
    #
    #     ssl_certificate      /etc/nginx/certs/cdac.crt;
    #     ssl_certificate_key  /etc/nginx/certs/cdac.key;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     ssl_ciphers          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache    shared:SSL:10m;
    #     ssl_session_timeout  10m;
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     # Copy all location blocks from the HTTP server block above here.
    # }
}
