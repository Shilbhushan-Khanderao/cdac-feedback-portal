# SERVER_NAME placeholder is replaced at image build (Dockerfile.web ARG SERVER_NAME).
worker_processes auto;
worker_rlimit_nofile 16384;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # INF-4: $request (and $request_uri) carry the OAuth code=/state= query string verbatim.
    # Mask the query string for /auth/* so it never lands in nginx's own access log; every
    # other path keeps its full request line (method, path, status, timing all still present).
    map $uri $safe_request {
        default    $request;
        ~^/auth/   "$request_method $uri $server_protocol";
    }

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$safe_request",'
      '"status":"$status","bytes":"$body_bytes_sent","request_time":"$request_time",'
      '"referer":"$http_referer","ua":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx cannot verify the session cookie's HMAC signature (it doesn't hold COOKIE_SECRET),
    # so keying its own limit_req on the raw cookie value is spoofable: a client can send a
    # fresh random cdac_session value per request to get a fresh bucket every time (confirmed
    # in VAPT simulation INF-1). This zone is therefore a coarse, NAT-safe per-IP backstop only.
    # The real fine-grained limit is apps/api/src/app.ts's Fastify rate-limiter, which verifies
    # the cookie signature before using it as a key and falls back to IP for anything unsigned.
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=1500r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1200r/m;
    limit_req_status 429;

    # INF-9: no cap on concurrent connections per IP, so one client could hold up to
    # worker_connections sockets (slow-connection / connection-exhaustion). Same NAT-safety
    # reasoning as the rate limits above: sized generously for a campus behind one NAT IP.
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream api_backend {
        server api:3000;
        keepalive 64;
    }

    server {
        listen 80 default_server;
        server_name _;
        limit_conn conn_limit 200;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location / { return 301 https://__SERVER_NAME__$request_uri; }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name __SERVER_NAME__;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn conn_limit 200;

        root /usr/share/nginx/html;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: clients must not be able to spoof their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Proxied locations: Fastify's helmet sets its own copy of these headers upstream.
        # Hide them so nginx's security-headers.conf (included below) is the single,
        # consistent source instead of two copies that duplicate or disagree (INF-8).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;

        # Liveness of nginx itself (used by the container healthcheck).
        location = /healthz {
            access_log off;
            default_type text/plain;
            include /etc/nginx/security-headers.conf;
            return 200 "ok\n";
        }

        # API + DB health (through to Fastify).
        location = /api/health {
            access_log off;
            proxy_pass http://api_backend;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=300 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # Vite emits content-hashed files here.
        location /assets/ {
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri /index.html;
            include /etc/nginx/security-headers.conf;
            # CL-5: no-store (not no-cache) so an authenticated page can't be served back out
            # of the disk/memory cache via browser Back after logout.
            add_header Cache-Control "no-store" always;
        }
    }
}
