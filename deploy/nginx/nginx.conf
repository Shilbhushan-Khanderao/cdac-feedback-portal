# SERVER_NAME placeholder is replaced at image build (Dockerfile.web ARG SERVER_NAME).
worker_processes auto;
worker_rlimit_nofile 16384;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
      '"status":"$status","bytes":"$body_bytes_sent","request_time":"$request_time",'
      '"referer":"$http_referer","ua":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Sized for campus NAT: many students share one source IP.
    # Campus NAT: many students share one IP, so /api is limited per session cookie (IP only when no cookie).
    map $cookie_cdac_session $api_key { default $cookie_cdac_session; "" $binary_remote_addr; }
    limit_req_zone $api_key zone=api_limit:20m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1200r/m;
    limit_req_status 429;

    upstream api_backend {
        server api:3000;
        keepalive 64;
    }

    # add_header is not inherited once a location declares its own, so every
    # location includes this snippet-by-copy. Keep the blocks identical.

    server {
        listen 80 default_server;
        server_name _;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location / { return 301 https://__SERVER_NAME__$request_uri; }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name __SERVER_NAME__;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: clients must not be able to spoof their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Liveness of nginx itself (used by the container healthcheck).
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 200 "ok\n";
        }

        # API + DB health (through to Fastify).
        location = /api/health {
            access_log off;
            proxy_pass http://api_backend;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=300 nodelay;
            proxy_pass http://api_backend;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://api_backend;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-store" always;
        }

        # Vite emits content-hashed files here.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        }
    }
}
