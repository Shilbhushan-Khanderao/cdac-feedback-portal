# Single source of truth for baseline security headers, included by every location
# block in nginx.conf (INF-8: hand-copied add_header blocks drift, e.g. /assets and
# /healthz were missing X-Frame-Options/CSP entirely). Locations proxying to the API
# (/api/, /auth/, /api/health) `proxy_hide_header` the equivalent helmet-set headers
# first so nginx is the one place these are set, instead of two conflicting copies.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
