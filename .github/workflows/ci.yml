name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      api: ${{ steps.f.outputs.api }}
      docker: ${{ steps.f.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # no usable base (new branch, force push): run everything
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) || files='*'
          hit() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          shared='^(package\.json|package-lock\.json|eslint\.config\.js|\.nvmrc|\.github/)|^\*$'
          echo "web=$(hit "$shared|^apps/web/")" >> "$GITHUB_OUTPUT"
          echo "api=$(hit "$shared|^apps/api/")" >> "$GITHUB_OUTPUT"
          echo "docker=$(hit "$shared|^(apps|deploy)/")" >> "$GITHUB_OUTPUT"
  frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b apps/web
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  server:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cdac_feedback_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cdac_feedback_test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/cdac_feedback_test
      APP_DB_PASSWORD: ci_app_password
      COOKIE_SECRET: ci_cookie_secret_ci_cookie_secret_0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p apps/api/tsconfig.test.json
      - run: npm run migrate -w apps/api
      - run: npm run seed -w apps/api
      - run: npm run server:test
      - run: npm audit --audit-level=high --omit=dev -w apps/api
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.server -t cdac-api:ci .
      - run: docker build -f deploy/Dockerfile.web -t cdac-web:ci .
