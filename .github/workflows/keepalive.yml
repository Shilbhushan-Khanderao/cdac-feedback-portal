name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity (e.g. between batches).
on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" "$URL/rest/v1/courses?select=id&limit=1")
          echo "HTTP $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 400 ]
